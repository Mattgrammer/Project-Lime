name: lime
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  hexcolor:
  cupertino_icons: ^1.0.8
  google_fonts:
  image_picker: ^1.0.0
  file_picker:
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter



  flutter_lints: ^6.0.0
  msix: ^3.16.1


flutter:
  uses-material-design: true
  assets:
    - lib/pages/assets/LIME ASSETS/limelogowithtext.png
    - lib/pages/assets/LIME ASSETS/limelogo.png
    - lib/pages/assets/LIME ASSETS/limetransparent.png
    - lib/pages/assets/LIME ASSETS/limetransparent-2.png
    - lib/pages/assets/LIME ASSETS/lime.png

msix_config:
  display_name: LIME
  publisher_display_name: Mattgrammer
  title: LIME
  identity_name: com.mattgrammer.lime
  logo_path: lib/pages/assets/LIME ASSETS/limelogo.png
  capabilities: internetClient